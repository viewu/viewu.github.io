name: Audit production health

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Capture mobile Lighthouse baseline
        continue-on-error: true
        run: >-
          npx --yes lighthouse@13.4.1 https://viewu.github.io/
          --quiet
          --form-factor=mobile
          --only-categories=performance,accessibility,best-practices,seo
          --output=json
          --output-path="${RUNNER_TEMP}/lighthouse-report.json"
          --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"

      - name: Audit live site, external links, and Lighthouse report
        run: npm run audit:production
        env:
          LIGHTHOUSE_REPORT_PATH: ${{ runner.temp }}/lighthouse-report.json
